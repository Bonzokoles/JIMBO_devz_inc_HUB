<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PUMO RAG - Demo Wyszukiwania</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      header {
        text-align: center;
        color: white;
        margin-bottom: 40px;
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
      }

      .subtitle {
        font-size: 1.1rem;
        opacity: 0.9;
      }

      .search-box {
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        margin-bottom: 30px;
      }

      .mode-toggle {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      .mode-btn {
        flex: 1;
        padding: 12px;
        border: 2px solid #667eea;
        background: white;
        color: #667eea;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s;
      }

      .mode-btn.active {
        background: #667eea;
        color: white;
      }

      .search-input-group {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
      }

      input[type="text"] {
        flex: 1;
        padding: 15px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 16px;
        transition: border 0.3s;
      }

      input[type="text"]:focus {
        outline: none;
        border-color: #667eea;
      }

      button {
        padding: 15px 30px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 16px;
        transition: background 0.3s;
      }

      button:hover:not(:disabled) {
        background: #5568d3;
      }

      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      .results {
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      }

      .result-header {
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 2px solid #e0e0e0;
      }

      .result-meta {
        display: flex;
        gap: 20px;
        color: #666;
        font-size: 14px;
      }

      .ai-answer {
        background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
        border-left: 4px solid #667eea;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 30px;
        line-height: 1.6;
      }

      .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
      }

      .product-card {
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        padding: 20px;
        transition: all 0.3s;
      }

      .product-card:hover {
        border-color: #667eea;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
      }

      .product-name {
        font-weight: 600;
        font-size: 16px;
        margin-bottom: 10px;
        color: #333;
      }

      .product-category {
        color: #667eea;
        font-size: 14px;
        margin-bottom: 10px;
      }

      .product-price {
        font-size: 20px;
        font-weight: 700;
        color: #764ba2;
        margin-bottom: 10px;
      }

      .product-score {
        background: #667eea15;
        color: #667eea;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        display: inline-block;
      }

      .product-link {
        display: inline-block;
        margin-top: 10px;
        color: #667eea;
        text-decoration: none;
        font-size: 14px;
      }

      .product-link:hover {
        text-decoration: underline;
      }

      .loading {
        text-align: center;
        padding: 40px;
        color: #667eea;
      }

      .error {
        background: #fee;
        border-left: 4px solid #f44;
        padding: 20px;
        border-radius: 8px;
        color: #c33;
      }

      .hidden {
        display: none;
      }

      .confidence-badge {
        background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
        color: white;
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 600;
      }

      @media (max-width: 768px) {
        h1 {
          font-size: 1.8rem;
        }

        .product-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🔍 PUMO RAG Search</h1>
        <p class="subtitle">
          Wyszukiwanie semantyczne + AI Chat powered by Cloudflare Workers
        </p>
      </header>

      <div class="search-box">
        <div class="mode-toggle">
          <button class="mode-btn active" data-mode="search">
            🔎 Proste Wyszukiwanie
          </button>
          <button class="mode-btn" data-mode="chat">💬 AI Chat (RAG)</button>
        </div>

        <div class="search-input-group">
          <input
            type="text"
            id="searchInput"
            placeholder="Np. tanie meble do salonu, nowoczesne krzesła..."
          />
          <button id="searchBtn">Szukaj</button>
        </div>

        <div
          class="result-meta"
          id="quickStats"
          style="margin-top: 10px; opacity: 0.7"
        >
          14,315 produktów w indeksie Vectorize
        </div>
      </div>

      <div id="results" class="results hidden">
        <div class="result-header">
          <h2 id="resultsTitle">Wyniki</h2>
          <div class="result-meta" id="resultsMeta"></div>
        </div>

        <div id="aiAnswer" class="ai-answer hidden"></div>

        <div id="productsGrid" class="product-grid"></div>

        <div id="loading" class="loading hidden">
          <p>⏳ Szukam...</p>
        </div>

        <div id="error" class="error hidden"></div>
      </div>
    </div>

    <script>
      const API_BASE = "https://pumo-rag.stolarnia-ams.workers.dev";
      let currentMode = "search";

      // Mode toggle
      document.querySelectorAll(".mode-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".mode-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentMode = btn.dataset.mode;

          if (currentMode === "chat") {
            document.getElementById("searchInput").placeholder =
              'Zadaj pytanie, np. "Jakie macie stylowe meble do salonu w cenie do 1000 zł?"';
          } else {
            document.getElementById("searchInput").placeholder =
              "Np. tanie meble do salonu, nowoczesne krzesła...";
          }
        });
      });

      // Search function
      async function performSearch(query) {
        const resultsDiv = document.getElementById("results");
        const loadingDiv = document.getElementById("loading");
        const errorDiv = document.getElementById("error");
        const productsGrid = document.getElementById("productsGrid");
        const aiAnswerDiv = document.getElementById("aiAnswer");
        const resultsMeta = document.getElementById("resultsMeta");
        const resultsTitle = document.getElementById("resultsTitle");

        // Show loading
        resultsDiv.classList.remove("hidden");
        loadingDiv.classList.remove("hidden");
        errorDiv.classList.add("hidden");
        aiAnswerDiv.classList.add("hidden");
        productsGrid.innerHTML = "";

        try {
          const endpoint = currentMode === "chat" ? "/api/chat" : "/api/search";
          const response = await fetch(API_BASE + endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query, limit: 12 }),
          });

          if (!response.ok) throw new Error(`HTTP ${response.status}`);

          const data = await response.json();
          loadingDiv.classList.add("hidden");

          if (currentMode === "chat") {
            // RAG Chat mode
            resultsTitle.textContent = "💬 Odpowiedź AI";
            aiAnswerDiv.classList.remove("hidden");
            aiAnswerDiv.innerHTML = data.answer.replace(/\n/g, "<br>");

            resultsMeta.innerHTML = `
                        <span>📚 Źródeł: ${data.sources.length}</span>
                        <span class="confidence-badge">Confidence: ${data.confidence}%</span>
                        <span>⚡ Cache: ${response.headers.get("X-Cache") || "MISS"}</span>
                    `;

            // Show sources as products
            if (data.sources && data.sources.length > 0) {
              data.sources.forEach((product) => {
                productsGrid.innerHTML += createProductCard(product, true);
              });
            }
          } else {
            // Simple search mode
            resultsTitle.textContent = "🔍 Znalezione produkty";
            resultsMeta.innerHTML = `<span>Wyników: ${data.results.length}</span>`;

            if (data.results.length === 0) {
              productsGrid.innerHTML =
                '<p style="text-align: center; color: #999; padding: 40px;">Nie znaleziono produktów</p>';
            } else {
              data.results.forEach((product) => {
                productsGrid.innerHTML += createProductCard(product, false);
              });
            }
          }
        } catch (error) {
          loadingDiv.classList.add("hidden");
          errorDiv.classList.remove("hidden");
          errorDiv.textContent = `❌ Błąd: ${error.message}`;
        }
      }

      function createProductCard(product, isSource) {
        const score = isSource
          ? ""
          : `<div class="product-score">Score: ${(product.score * 100).toFixed(1)}%</div>`;
        const url =
          product.url || `https://www.meblepumo.pl/pl/products/${product.id}`;

        return `
                <div class="product-card">
                    <div class="product-name">${product.name || product.title}</div>
                    <div class="product-category">${product.category}</div>
                    <div class="product-price">${product.price} PLN</div>
                    ${score}
                    <a href="${url}" target="_blank" class="product-link">Zobacz produkt →</a>
                </div>
            `;
      }

      // Event listeners
      document.getElementById("searchBtn").addEventListener("click", () => {
        const query = document.getElementById("searchInput").value.trim();
        if (query) performSearch(query);
      });

      document
        .getElementById("searchInput")
        .addEventListener("keypress", (e) => {
          if (e.key === "Enter") {
            const query = e.target.value.trim();
            if (query) performSearch(query);
          }
        });

      // Example searches
      const examples = [
        "tanie meble do salonu",
        "nowoczesne krzesła",
        "białe regały",
        "Jakie macie stylowe meble do salonu w cenie do 1000 zł?",
      ];

      // Auto-focus on input
      document.getElementById("searchInput").focus();
    </script>
  </body>
</html>
