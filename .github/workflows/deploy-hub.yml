name: Deploy Hub to Cloudflare Pages

on:
  push:
    branches: ["main"]
    paths:
      - "Jimbo_77/frontend/apps/hub/**"
      - "Jimbo_77/frontend/pnpm-lock.yaml"
      - "Jimbo_77/frontend/package.json"
      - ".github/workflows/deploy-hub.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: "Jimbo_77/frontend/pnpm-lock.yaml"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: Jimbo_77/frontend

      - name: Build Frontend (Hub)
        run: pnpm --filter @jimbo77/hub build
        working-directory: Jimbo_77/frontend
        env:
          # Inject secrets into build process (needed for Vite envs)
          VITE_API_BASE: ${{ vars.VITE_API_BASE || 'https://jimbo-like-pumo-api.stolarnia-ams.workers.dev' }}
          VITE_ENV: "production"

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: "jimbo-devz-inc-hub"
          directory: "Jimbo_77/frontend/apps/hub/dist"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
