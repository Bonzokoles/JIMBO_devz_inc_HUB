name: Deploy Jimbo77 to Cloudflare Pages

on:
    push:
        branches: [main]
        paths:
            - "Jimbo_77/frontend/apps/hub/**"
            - "Jimbo_77/frontend/pnpm-lock.yaml"
            - "Jimbo_77/frontend/package.json"
            - ".github/workflows/deploy-jimbo77.yml"
    workflow_dispatch:

jobs:
    deploy-frontend:
        runs-on: ubuntu-latest
        name: Deploy Frontend to Cloudflare Pages

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 8

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "pnpm"
                  cache-dependency-path: "Jimbo_77/frontend/pnpm-lock.yaml"

            - name: Install dependencies
              working-directory: Jimbo_77/frontend
              run: pnpm install --frozen-lockfile

            - name: Build
              working-directory: Jimbo_77/frontend/apps/hub
              run: pnpm run build
              env:
                  VITE_API_BASE: ${{ secrets.VITE_API_BASE || 'http://localhost:8001' }}

            - name: Deploy to Cloudflare Pages
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: pages deploy dist --project-name=jimbo77-hub
                  workingDirectory: Jimbo_77/frontend/apps/hub

            - name: Deployment Summary
              run: |
                  echo "✅ Frontend deployed successfully!"
                  echo "🌐 URL: https://jimbo77-hub.pages.dev"
                  echo "📦 Build size: $(du -sh Jimbo_77/frontend/apps/hub/dist | cut -f1)"
