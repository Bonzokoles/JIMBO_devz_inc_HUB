name: Deploy Network Control to Cloudflare Pages

on:
  push:
    branches: ["main"]
    paths:
      - "Jimbo_77/frontend/apps/network-control/**"
      - "Jimbo_77/frontend/package.json"
      - "Jimbo_77/frontend/pnpm-lock.yaml"
      - ".github/workflows/deploy-network-control.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install
        working-directory: Jimbo_77/frontend/apps/network-control

      - name: Build Network Control
        run: npm run build
        working-directory: Jimbo_77/frontend/apps/network-control
        env:
          VITE_BACKEND_API_URL: ${{ vars.VITE_BACKEND_API_URL || 'https://jimbo-backend.stolarnia-ams.workers.dev' }}
          VITE_AGENT_ZERO_API_URL: ${{ vars.VITE_AGENT_ZERO_API_URL || 'https://agent-zero.jimbo77.com' }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: "fragrant-dream-4257"
          directory: "Jimbo_77/frontend/apps/network-control/dist"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
