# Ngrok AI Gateway - Production Configuration
# Gateway ID: rd_33FaSZ9e7c6yHF9q1mFNNme2fDG
# Domain: smallish-apocalyptically-candis.ngrok-free.dev
# Created: 2026-01-18

version: 2

# Multi-provider configuration with intelligent failover
providers:
  # PRIMARY: Gemini 1.5 Pro - FREE Tier (50% traffic target)
  gemini-free:
    provider: google
    model: gemini-1.5-pro
    credentials:
      api_key: ${VAULT_GEMINI_KEY}
    rate_limit:
      requests_per_minute: 60  # Google Free tier limit
    weight: 50  # 50% of traffic
    
  # SECONDARY: Claude 3.5 Sonnet via OpenRouter (30% traffic)
  claude-via-openrouter:
    provider: openrouter
    model: anthropic/claude-3.5-sonnet
    credentials:
      api_key: ${VAULT_OPENROUTER_KEY}
    rate_limit:
      requests_per_minute: 300
    weight: 30  # 30% of traffic
    
  # TERTIARY: DeepSeek R1 via OpenRouter (20% traffic - cost optimization)
  deepseek-r1:
    provider: openrouter
    model: deepseek/deepseek-r1
    credentials:
      api_key: ${VAULT_DEEPSEEK_KEY}
    rate_limit:
      requests_per_minute: 200
    weight: 20  # 20% of traffic
    
  # BACKUP: OpenAI GPT-4 with API rotation (0% default, only on failover)
  openai-rotation-1:
    provider: openai
    model: gpt-4-turbo
    credentials:
      api_key: ${VAULT_OPENAI_KEY_1}
    rate_limit:
      requests_per_minute: 500
    weight: 0  # Failover only
    
  openai-rotation-2:
    provider: openai
    model: gpt-4-turbo
    credentials:
      api_key: ${VAULT_OPENAI_KEY_2}
    rate_limit:
      requests_per_minute: 500
    weight: 0  # Failover only
    
  openai-rotation-3:
    provider: openai
    model: gpt-4-turbo
    credentials:
      api_key: ${VAULT_OPENAI_KEY_3}
    rate_limit:
      requests_per_minute: 500
    weight: 0  # Failover only

# Failover strategy
failover:
  enabled: true
  max_retries: 3
  retry_on:
    - rate_limit_exceeded
    - timeout
    - server_error
    - authentication_error
  
  # Cascade order
  strategy: cascade
  cascade_order:
    1: [gemini-free, claude-via-openrouter, deepseek-r1]  # Priority 1: Normal operation
    2: [openai-rotation-1, openai-rotation-2]              # Priority 2: Failover
    3: [openai-rotation-3]                                  # Priority 3: Last resort
  
  # Circuit breaker (disable provider if >50% error rate)
  circuit_breaker:
    enabled: true
    error_threshold: 0.5  # 50% error rate
    timeout: 300  # 5 minutes cooldown

# Traffic policy
traffic_policy:
  # Cost-based routing
  cost_optimization:
    enabled: true
    prefer_free_tier: true  # Prefer Gemini FREE when available
    
  # Rate limit awareness
  rate_limit_aware: true
  distribute_on_limit: true  # Auto-switch provider when rate limited
  
  # Latency-based routing
  latency_routing:
    enabled: true
    max_latency_ms: 5000  # Switch if response >5s

# Content modification
content_policy:
  # PII redaction (optional)
  redact_pii: false
  
  # Request/response logging
  logging:
    enabled: true
    log_requests: true
    log_responses: false  # Privacy: don't log full responses
    log_errors: true

# Monitoring & Telemetry
telemetry:
  # OpenTelemetry export
  opentelemetry:
    enabled: true
    endpoint: https://otel-collector.jimbo77.com:4318  # To be configured
    headers:
      authorization: "Bearer ${VAULT_OTEL_TOKEN}"
    
  # Prometheus metrics
  prometheus:
    enabled: true
    endpoint: /metrics
    
  # Custom metrics
  metrics:
    - request_count
    - request_latency
    - error_rate
    - cost_per_request
    - provider_selection
    - cache_hit_rate

# Security
security:
  # API key validation
  require_api_key: true
  api_keys:
    - ${VAULT_JIMBO_API_KEY_1}
    - ${VAULT_JIMBO_API_KEY_2}
  
  # CORS
  cors:
    enabled: true
    allowed_origins:
      - https://jimbo77.com
      - https://jimbo77.org
      - https://mybonzoaiblog.com
      - https://orchestrator.jimbo77.com
      - https://pumo-rag.stolarnia-ams.workers.dev
    allowed_methods:
      - GET
      - POST
      - OPTIONS
    allowed_headers:
      - Content-Type
      - Authorization

# Rate limiting (per client)
rate_limiting:
  enabled: true
  requests_per_minute: 120  # Per API key
  burst: 200

# Caching (Layer 4 fallback)
caching:
  enabled: true
  ttl: 3600  # 1 hour cache
  cache_embeddings: true  # Cache embedding results
  cache_completions: false  # Don't cache chat (non-deterministic)

---

# DEPLOYMENT INSTRUCTIONS

## 1. Create Vault Secrets

```bash
# Gemini FREE tier
ngrok vault add VAULT_GEMINI_KEY "YOUR_GEMINI_API_KEY"

# OpenRouter (for Claude + DeepSeek)
ngrok vault add VAULT_OPENROUTER_KEY "YOUR_OPENROUTER_API_KEY"

# DeepSeek direct (optional, or use via OpenRouter)
ngrok vault add VAULT_DEEPSEEK_KEY "YOUR_DEEPSEEK_API_KEY"

# OpenAI rotation (3 keys for rate limit mitigation)
ngrok vault add VAULT_OPENAI_KEY_1 "sk-proj-..."
ngrok vault add VAULT_OPENAI_KEY_2 "sk-proj-..."
ngrok vault add VAULT_OPENAI_KEY_3 "sk-proj-..."

# JIMBO API keys (for securing ngrok endpoint)
ngrok vault add VAULT_JIMBO_API_KEY_1 "$(openssl rand -hex 32)"
ngrok vault add VAULT_JIMBO_API_KEY_2 "$(openssl rand -hex 32)"

# OpenTelemetry (for monitoring)
ngrok vault add VAULT_OTEL_TOKEN "$(openssl rand -hex 32)"
```

## 2. Deploy Configuration

```bash
# Via ngrok CLI
ngrok ai-gateway config apply 01_ngrok_config.yml

# Or via Dashboard UI
# 1. Login to https://dashboard.ngrok.com/ai-gateway
# 2. Select gateway: rd_33FaSZ9e7c6yHF9q1mFNNme2fDG
# 3. Upload YAML configuration
```

## 3. Test Endpoint

```bash
# Test chat completion
curl -X POST https://smallish-apocalyptically-candis.ngrok-free.dev/v1/chat/completions \
  -H "Authorization: Bearer YOUR_JIMBO_API_KEY" \
  -H "Content-Type: application/json" \
  -d '{
    "model": "gpt-4-turbo",
    "messages": [{"role": "user", "content": "Hello ngrok!"}]
  }'

# Expected: Response routed through Gemini FREE (50% probability)
# Check X-Ngrok-Provider header to verify which provider was used
```

## 4. Verify Failover

```bash
# Simulate Gemini rate limit (make 60+ requests/min)
for i in {1..70}; do
  curl -X POST https://smallish-apocalyptically-candis.ngrok-free.dev/v1/chat/completions \
    -H "Authorization: Bearer YOUR_JIMBO_API_KEY" \
    -H "Content-Type: application/json" \
    -d '{"model":"gpt-4-turbo","messages":[{"role":"user","content":"Test '$i'"}]}'
  sleep 0.5
done

# Expected: First 60 routed to Gemini, then automatic failover to Claude/DeepSeek
```

## 5. Monitor Dashboard

```bash
# Access ngrok dashboard
open https://dashboard.ngrok.com/ai-gateway/rd_33FaSZ9e7c6yHF9q1mFNNme2fDG

# Check metrics:
# - Request count by provider
# - Error rate
# - Average latency
# - Cost tracking
```

