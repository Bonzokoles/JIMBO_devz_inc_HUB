server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://CENTRAL_IP:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets: [localhost]
        labels:
          job: docker
          host: HOSTNAME_PLACEHOLDER
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      - docker: {}
      # jeśli Twoje aplikacje logują JSON w polu "log", to to rozbije:
      - json:
          expressions:
            level: level
            msg: msg
            service: service
            trace_id: otelTraceID
            span_id: otelSpanID
      # NIE dawaj trace_id jako LABEL (zabije Loki kardynalnością).
      # Zostaw trace_id jako field w log line (wystarczy do wyszukiwania).
