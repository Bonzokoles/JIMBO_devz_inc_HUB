devices:
  - id: "Router_Main"
    name: "Główny Router (ASUS)"
    ip: "192.168.1.1"
    login_url: "http://192.168.1.1/Main_Login.asp"
    selectors:
      username: "input[name='login_username']"
      password: "input[name='login_passwd']"
      submit: ".button"
    credentials_env_prefix: "ROUTER_MAIN"

  - id: "Switch_PoE"
    name: "Switch PoE (TP-Link)"
    ip: "192.168.1.2"
    login_url: "http://192.168.1.2/"
    selectors:
      username: "#username"
      password: "#password"
      submit: "#login-btn"
    credentials_env_prefix: "SWITCH_POE"

# Agent Zero Integration
agents:
  - id: "AgentZero_Main"
    name: "Agent Zero Unified (Conda/SQL/MCP)"
    url: "http://localhost:50082"
    public_url: "https://jump-column-guardian-deeper.trycloudflare.com"
    type: "autonomous_agent"
    api_endpoints:
      status: "/api/status"
      execute: "/api/execute"
      files: "/api/files"
    capabilities:
      - web_navigation
      - code_execution
      - file_operations
      - docker_control
      - openrouter_integration
    credentials_env_prefix: "AGENT_ZERO"
    tunnel:
      provider: "Cloudflare"
      active: true
      created: "2026-01-23"
