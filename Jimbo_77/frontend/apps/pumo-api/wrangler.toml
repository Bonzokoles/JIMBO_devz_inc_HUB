name = "jimbo-like-pumo-api"
main = "src/index-new.ts"
compatibility_date = "2026-01-08"

# Keep workers.dev enabled as a fallback URL
workers_dev = true

# Custom domain route (Cloudflare DNS zone: jimbolikepumo.dev)
# COMMENTED OUT: Zone "jimbolikepumo.dev" does not exist on Cloudflare account
# Worker is available at: jimbo-like-pumo-api.workers.dev
# routes = [
#   { pattern = "api.jimbolikepumo.dev/*", zone_name = "jimbolikepumo.dev" }
# ]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "jimbo-rag-db"
database_id = "90fe9b43-f8a4-4e78-94c5-c44aff4012e9"  # pumo_products

# Vectorize
[[vectorize]]
binding = "VECTORIZE"
index_name = "pumo_embeddings"

# KV for cache
[[kv_namespaces]]
binding = "CACHE"
id = "dd9f40a8318d4275ae760b1194833723"  # CACHE (pumo-chunk-processor-CACHE)

# AI binding
[ai]
binding = "AI"

# R2 bucket for raw data backup
[[r2_buckets]]
binding = "PUMO_RAW_BUCKET"
bucket_name = "pumo-raw-data"

# Environment variables
[vars]
ALLOWED_ORIGINS = "https://www.mybonzoaiblog.com,http://localhost:4656"
PUMO_API_BASE_URL = "https://api.meblepumo.pl/v1"
DASHBOARD_API_BASE = ""
GA4_PROPERTY_ID = ""
CF_ACCESS_AUD = ""
CF_ACCESS_JWKS_URL = ""

# Cron triggers - Every 6 hours + weekly cleanup
[triggers]
crons = [
  "0 */6 * * *",      # Sync co 6h
  "0 3 * * SUN"       # Cleanup w niedzielę o 3:00
]

# Secrets (set via: wrangler secret put SECRET_NAME)
# - DASHBOARD_PASSWORD (simple password for dashboard access, e.g., #HAOS77#)
# - ANTHROPIC_API_KEY
# - OPENAI_API_KEY
# - DKIM_PRIVATE_KEY
# - GA4_MEASUREMENT_ID
# - GA4_API_SECRET
# - GA4_SERVICE_ACCOUNT_JSON
# - PUMO_API_KEY
# - PUMO_PRODUCTS_API_KEY
# - PUMO_ORDERS_API_KEY
