global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # Przykład: hosty (podmień na swoje IP/nazwy)
  - job_name: nodes
    static_configs:
      - targets:
          - "10.0.0.11:9100"
          - "10.0.0.12:9100"
          - "10.0.0.13:9100"

  - job_name: cadvisor
    static_configs:
      - targets:
          - "10.0.0.11:8080"
          - "10.0.0.12:8080"
          - "10.0.0.13:8080"

  # FastAPI /metrics (jeśli dodasz instrumentację)
  - job_name: ops-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api.ops.internal:8000"]
